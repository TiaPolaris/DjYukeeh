<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dj Yukeeh - Artista Independente</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            500: '#d946ef', /* Violeta Neon */
                            600: '#c026d3',
                            700: '#a21caf',
                            900: '#4c1d95',
                            accent: '#3b82f6', /* Azul Elétrico */
                            glow: '#e879f9',   /* Magenta Claro */
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Scrollbar customizada */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(3, 0, 20, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(217, 70, 239, 0.2);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(217, 70, 239, 0.5);
        }
        
        /* Classes Glassmorphic reutilizáveis */
        .glass-card {
            background: rgba(15, 13, 35, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(217, 70, 239, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-header {
            background: rgba(3, 0, 20, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(217, 70, 239, 0.15);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-button:hover {
            background: rgba(217, 70, 239, 0.15);
            border-color: rgba(217, 70, 239, 0.3);
        }

        /* Animação para vinil */
        .rotating-cover {
            animation: spin 20s linear infinite;
            animation-play-state: paused;
        }
        .playing .rotating-cover {
            animation-play-state: running;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Sliders estilo Glass */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #d946ef;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 15px #d946ef;
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-[#030014] text-slate-100 font-sans min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <!-- Efeitos de Fundo (Glows que reagem por trás do Glass) -->
    <div class="fixed top-[-10%] left-[-10%] w-[500px] h-[500px] bg-brand-500/20 rounded-full blur-[140px] pointer-events-none -z-10"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-brand-accent/20 rounded-full blur-[160px] pointer-events-none -z-10"></div>
    <div class="fixed top-[40%] left-[50%] -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-purple-600/15 rounded-full blur-[130px] pointer-events-none -z-10"></div>

    <!-- Header Glass -->
    <header class="w-full glass-header sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="text-center sm:text-left">
                <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-brand-500 via-pink-400 to-brand-accent bg-clip-text text-transparent">
                    Dj Yukeeh
                </h1>
                <p class="text-xs text-purple-200/60 font-medium">Você Entrou no Universo da Yukeeh</p>
            </div>
            
            <!-- Badge de Status Glass -->
            <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-button text-xs text-purple-200">
                <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse shadow-[0_0_10px_#d946ef]"></span>
                <span>Disponível para ouvir e baixar</span>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start relative z-10">
        
        <!-- Player Glass (Coluna da Esquerda) -->
        <section class="lg:col-span-7 glass-card rounded-3xl p-6 md:p-8 flex flex-col items-center">
            
            <!-- Capa da Música com Anel Glass / Neon -->
            <div class="relative group my-4">
                <div class="absolute -inset-2 bg-gradient-to-r from-brand-500 via-purple-600 to-brand-accent rounded-full blur-2xl opacity-40 group-hover:opacity-75 transition duration-500"></div>
                <div class="relative w-48 h-48 sm:w-64 sm:h-64 rounded-full overflow-hidden border-4 border-white/10 shadow-2xl rotating-cover flex items-center justify-center bg-[#030014]/80">
                    <img id="track-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80" alt="Capa da música" class="w-full h-full object-cover">
                    <!-- Furo central de disco de vinil -->
                    <div class="absolute w-8 h-8 rounded-full bg-[#030014] border-2 border-white/20 z-10 shadow-inner"></div>
                </div>
            </div>

            <!-- Detalhes da Música -->
            <div class="text-center mt-6 w-full">
                <h2 id="track-title" class="text-2xl font-bold text-white tracking-wide truncate">Título da Música</h2>
                <p id="track-artist" class="text-purple-200/70 text-sm mt-1">Nome do Artista</p>
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full glass-button text-purple-200 text-xs mt-3">
                    <i data-lucide="disc" class="w-3.5 h-3.5 text-brand-500"></i>
                    <span id="track-album">Single / Álbum</span>
                </div>
            </div>

            <!-- Barra de Progresso -->
            <div class="w-full mt-6">
                <div class="relative flex items-center">
                    <input type="range" id="progress-bar" min="0" max="100" value="0" class="w-full h-2 rounded-lg cursor-pointer">
                </div>
                <div class="flex justify-between text-xs font-mono text-purple-200/50 mt-2">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <!-- Controle do Player -->
            <div class="flex items-center justify-center gap-4 sm:gap-6 mt-6 w-full">
                <button id="btn-shuffle" class="p-2.5 text-purple-200/50 hover:text-white transition rounded-full hover:bg-white/10" title="Modo Aleatório">
                    <i data-lucide="shuffle" class="w-5 h-5"></i>
                </button>

                <button id="btn-prev" class="p-3 text-slate-200 hover:text-brand-500 transition rounded-full hover:bg-white/10 active:scale-95" title="Anterior">
                    <i data-lucide="skip-back" class="w-6 h-6"></i>
                </button>

                <button id="btn-play" class="p-5 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-purple-700 text-white rounded-full shadow-[0_0_25px_rgba(217,70,239,0.5)] transition transform hover:scale-105 active:scale-95" title="Reproduzir / Pausar">
                    <i data-lucide="play" id="play-icon" class="w-7 h-7 fill-current"></i>
                </button>

                <button id="btn-next" class="p-3 text-slate-200 hover:text-brand-500 transition rounded-full hover:bg-white/10 active:scale-95" title="Próxima">
                    <i data-lucide="skip-forward" class="w-6 h-6"></i>
                </button>

                <button id="btn-repeat" class="p-2.5 text-purple-200/50 hover:text-white transition rounded-full hover:bg-white/10" title="Repetir Faixa">
                    <i data-lucide="repeat" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Volume e Download -->
            <div class="flex items-center justify-between w-full mt-6 pt-6 border-t border-white/10 gap-4">
                <div class="flex items-center gap-2 w-1/2 max-w-[160px]">
                    <button id="btn-mute" class="text-purple-200/60 hover:text-purple-200">
                        <i data-lucide="volume-2" id="volume-icon" class="w-5 h-5"></i>
                    </button>
                    <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0.8" class="w-full">
                </div>

        </section>

        <!-- Playlist e Redes Glass (Coluna da Direita) -->
        <section class="lg:col-span-5 flex flex-col gap-6 w-full">
            
            <!-- Lista de Músicas -->
            <div class="glass-card rounded-3xl p-5 flex flex-col max-h-[460px]">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
                    <h3 class="font-bold text-white flex items-center gap-2 text-base">
                        <i data-lucide="list-music" class="w-5 h-5 text-brand-500"></i>
                        <span>Playlist / Faixas</span>
                    </h3>
                    <span id="playlist-count" class="text-xs glass-button text-purple-200 px-2.5 py-1 rounded-full font-mono">0 faixas</span>
                </div>

                <div id="playlist-container" class="overflow-y-auto space-y-2 pr-1 flex-1">
                    <!-- Inserido via JS -->
                </div>
            </div>

            <!-- Redes Sociais -->
            <div class="glass-card rounded-3xl p-5">
                <h3 class="font-bold text-white mb-3 text-sm flex items-center gap-2">
                    <i data-lucide="share-2" class="w-4 h-4 text-brand-accent"></i>
                    <span>Acompanhe meu trabalho</span>
                </h3>
                <div class="grid grid-cols-2 gap-2.5">
                    <a href="https://www.youtube.com/@DjYukeeh" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 p-3 rounded-xl glass-button hover:bg-red-500/15 hover:border-red-500/30 text-purple-200 hover:text-red-400 transition text-xs font-medium">
                        <i data-lucide="youtube" class="w-4 h-4 text-red-500"></i>
                        <span>YouTube</span>
                    </a>
                    <a href="https://www.tiktok.com/@djyukeeh" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 p-3 rounded-xl glass-button hover:bg-pink-500/15 hover:border-pink-500/30 text-purple-200 hover:text-pink-400 transition text-xs font-medium">
                        <i data-lucide="tiktok" class="w-4 h-4 text-pink-500"></i>
                        <span>Instagram</span>
                    </a>
                    <a href="https://www.instagram.com/djyukeeh/" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 p-3 rounded-xl glass-button hover:bg-emerald-500/15 hover:border-emerald-500/30 text-purple-200 hover:text-emerald-400 transition text-xs font-medium">
                        <i data-lucide="instagram" class="w-4 h-4 text-emerald-500"></i>
                        <span>WhatsApp</span>
                </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer class="w-full border-t border-white/10 bg-[#030014]/60 backdrop-blur-md py-6 mt-8 relative z-10">
        <div class="max-w-5xl mx-auto px-4 text-center text-xs text-purple-200/40">
            <p>© <span id="year"></span> Dj Yukeeh. Todos os direitos reservados.</p>
            <p class="mt-1 text-purple-300/20">Criado por Tia Polaris</p>
        </div>
    </footer>

    <!-- Tag Audio -->
    <audio id="audio-player" class="hidden"></audio>

    <script>
        // Playlist
        const playlist = [
            {
                title: "Vibrações Noturnas",
                artist: "Seu Nome de Artista",
                album: "Single - 2024",
                duration: "2:45",
                cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80",
                url: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"
            },
            {
                title: "Ecos do Infinito",
                artist: "Seu Nome de Artista",
                album: "EP Horizonte",
                duration: "3:12",
                cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80",
                url: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=ambient-piano-amp-strings-10711.mp3"
            },
            {
                title: "Estrada de Sangue e Sol",
                artist: "Seu Nome de Artista",
                album: "EP Horizonte",
                duration: "2:18",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80",
                url: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=chill-abstract-intention-12099.mp3"
            },
            {
                title: "Madrugada Synth",
                artist: "Seu Nome de Artista",
                album: "Single - 2023",
                duration: "2:50",
                cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?auto=format&fit=crop&w=600&q=80",
                url: "https://cdn.pixabay.com/download/audio/2022/10/14/audio_9939f7922d.mp3?filename=synthwave-80s-110045.mp3"
            }
        ];

        // Elementos DOM
        const audio = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');
        const playIcon = document.getElementById('play-icon');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnShuffle = document.getElementById('btn-shuffle');
        const btnRepeat = document.getElementById('btn-repeat');
        const progressBar = document.getElementById('progress-bar');
        const volumeBar = document.getElementById('volume-bar');
        const btnMute = document.getElementById('btn-mute');
        const volumeIcon = document.getElementById('volume-icon');
        const btnDownload = document.getElementById('btn-download');

        const trackCover = document.getElementById('track-cover');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const trackAlbum = document.getElementById('track-album');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const playlistContainer = document.getElementById('playlist-container');
        const playlistCount = document.getElementById('playlist-count');

        // Estado
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let lastVolume = 0.8;

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            renderPlaylist();
            loadTrack(currentIndex);
            lucide.createIcons();
        });

        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.url;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            trackAlbum.textContent = track.album;
            trackCover.src = track.cover;
            btnDownload.href = track.url;

            updatePlaylistUI();

            progressBar.value = 0;
            currentTimeEl.textContent = '0:00';
            totalDurationEl.textContent = track.duration || '0:00';
        }

        function togglePlay() {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        }

        function playTrack() {
            isPlaying = true;
            audio.play().catch(e => console.log("Permissão necessária para áudio"));
            playIcon.setAttribute('data-lucide', 'pause');
            document.body.classList.add('playing');
            lucide.createIcons();
            updatePlaylistUI();
        }

        function pauseTrack() {
            isPlaying = false;
            audio.pause();
            playIcon.setAttribute('data-lucide', 'play');
            document.body.classList.remove('playing');
            lucide.createIcons();
            updatePlaylistUI();
        }

        function nextTrack() {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * playlist.length);
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            loadTrack(currentIndex);
            playTrack();
        }

        function prevTrack() {
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            playTrack();
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalDurationEl.textContent = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration) {
                const seekTime = (progressBar.value / 100) * audio.duration;
                audio.currentTime = seekTime;
            }
        });

        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                playTrack();
            } else {
                nextTrack();
            }
        });

        volumeBar.addEventListener('input', (e) => {
            const val = e.target.value;
            audio.volume = val;
            updateVolumeIcon(val);
        });

        btnMute.addEventListener('click', () => {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                audio.volume = 0;
                volumeBar.value = 0;
            } else {
                audio.volume = lastVolume;
                volumeBar.value = lastVolume;
            }
            updateVolumeIcon(audio.volume);
        });

        function updateVolumeIcon(vol) {
            if (vol == 0) {
                volumeIcon.setAttribute('data-lucide', 'volume-x');
            } else if (vol < 0.5) {
                volumeIcon.setAttribute('data-lucide', 'volume-1');
            } else {
                volumeIcon.setAttribute('data-lucide', 'volume-2');
            }
            lucide.createIcons();
        }

        btnShuffle.addEventListener('click', () => {
            isShuffle = !isShuffle;
            btnShuffle.classList.toggle('text-brand-500', isShuffle);
            btnShuffle.classList.toggle('text-purple-200/50', !isShuffle);
        });

        btnRepeat.addEventListener('click', () => {
            isRepeat = !isRepeat;
            btnRepeat.classList.toggle('text-brand-500', isRepeat);
            btnRepeat.classList.toggle('text-purple-200/50', !isRepeat);
        });

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlistCount.textContent = `${playlist.length} faixas`;

            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `track-item group flex items-center justify-between p-2.5 rounded-2xl cursor-pointer transition border ${
                    index === currentIndex 
                    ? 'bg-brand-500/20 border-brand-500/40 shadow-[0_0_15px_rgba(217,70,239,0.2)]' 
                    : 'border-transparent hover:bg-white/5'
                }`;
                
                item.onclick = () => {
                    if (currentIndex === index && isPlaying) {
                        pauseTrack();
                    } else {
                        currentIndex = index;
                        loadTrack(currentIndex);
                        playTrack();
                    }
                };

                item.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="relative w-10 h-10 rounded-xl overflow-hidden bg-[#030014] flex-shrink-0 border border-white/10">
                            <img src="${track.cover}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                <i data-lucide="${index === currentIndex && isPlaying ? 'pause' : 'play'}" class="w-4 h-4 text-white"></i>
                            </div>
                        </div>
                        <div class="truncate">
                            <p class="text-xs font-semibold ${index === currentIndex ? 'text-brand-500' : 'text-purple-100'} truncate">${track.title}</p>
                            <p class="text-[11px] text-purple-200/50 truncate">${track.album}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 pl-2">
                        ${index === currentIndex && isPlaying ? `
                            <div class="flex gap-0.5 items-end h-3">
                                <span class="w-0.5 h-full bg-brand-500 animate-bounce"></span>
                                <span class="w-0.5 h-2/3 bg-brand-500 animate-bounce [animation-delay:0.2s]"></span>
                                <span class="w-0.5 h-4/5 bg-brand-500 animate-bounce [animation-delay:0.4s]"></span>
                            </div>
                        ` : ''}
                        <span class="text-[11px] font-mono text-purple-200/50">${track.duration}</span>
                    </div>
                `;
                playlistContainer.appendChild(item);
            });
            lucide.createIcons();
        }

        function updatePlaylistUI() {
            renderPlaylist();
        }

        btnPlay.addEventListener('click', togglePlay);
        btnNext.addEventListener('click', nextTrack);
        btnPrev.addEventListener('click', prevTrack);

    ****plAYLIST***
    const playlist = [
    {
        title: "Nome da Sua Primeira Música",
        artist: "Seu Nome / Nome da Banda",
        album: "Single - 2024",
        duration: "3:45", // Duração aproximada
        cover: "capas/capa1.jpg", // Caminho para a imagem na pasta capas
        url: "musicas/musica1.mp3" // Caminho para a música na pasta musicas
    },
    {
        title: "Nome da Segunda Música",
        artist: "Seu Nome / Nome da Banda",
        album: "Álbum Meu Início",
        duration: "2:50",
        cover: "capas/capa2.jpg",
        url: "musicas/musica2.mp3"
    }
];
    </script>
</body>
</html>
